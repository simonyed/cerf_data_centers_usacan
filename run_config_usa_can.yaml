settings:
  region_raster_path: "USA_CAN_inputs/state_siting_region.tif"
  siting_raster_path: "USA_CAN_inputs/composite_siting_suitability.tif"
  output_root: "outputs/usa_can_batches"
  cost_weight: 1.0
  market_weight: 0.0
  # 1 = include this location-dependent cost category; 0 = set it to zero.
  enable_land_and_real_property_tax: 0
  enable_personal_property_tax: 0
  enable_sales_tax: 1
  enable_industrial_electricity_and_cooling: 0

constraints:
  land_cost_per_sqft: "USA_CAN_inputs/land_value_dollar_per_sqft.tif"
  electricity_rate_per_kwh: "USA_CAN_inputs/industrial_electricity_rates_dollar_per_kwh.tif"
  personal_prop_tax_rate: "USA_CAN_inputs/personal_property_tax_rate.tif"
  real_property_tax_rate: "USA_CAN_inputs/real_property_tax_rate.tif"
  sales_tax_rate: "USA_CAN_inputs/sales_tax_rate.tif"
  interconnection_distance_km: "USA_CAN_inputs/distance_to_substation.tif"
  mechanical_cool_fraction: "USA_CAN_inputs/mechanical_cooling_fraction.tif"
  water_cool_fraction: "USA_CAN_inputs/water_cooling_fraction.tif"

market_gravity:
  market_raster_path: "USA_CAN_inputs/data_center_market_locations.tif"

scenarios:
  large:
    campus_size_square_ft: 4_000_000
    equipment_capital_expenditure_usd: 44_800_000_000
    building_capital_expenditure_usd: 5_400_000_000
    data_center_it_power_mw: 1600
    data_center_pue: 1.14
    interconnection_cost_usd_per_km: 3_000_000
    n_sites: 100
  medium:
    campus_size_square_ft: 2_000_000
    equipment_capital_expenditure_usd: 22_400_000_000
    building_capital_expenditure_usd: 2_900_000_000
    data_center_it_power_mw: 800
    data_center_pue: 1.14
    interconnection_cost_usd_per_km: 3_000_000
    n_sites: 200
  small:
    campus_size_square_ft: 1_000_000
    equipment_capital_expenditure_usd: 11_200_000_000
    building_capital_expenditure_usd: 1_650_000_000
    data_center_it_power_mw: 400
    data_center_pue: 1.14
    interconnection_cost_usd_per_km: 3_000_000
    n_sites: 400

